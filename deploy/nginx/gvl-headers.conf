# 安全响应头（被 life-daogong 各 location include；nginx add_header 不继承，
# 所以凡自带 add_header 的 location 都必须 include 本文件）
# 2026-10-16 复盘：生产原先无 nosniff/HSTS/X-Frame-Options/Referrer-Policy/Permissions-Policy
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# HSTS：本站全站 HTTPS（CF 边缘证书 + Let's Encrypt 自动续期）。180 天、不含
# includeSubDomains/preload（子域未逐一确认 HTTPS，避免误锁）。回退=删本行并降 max-age。
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP（2026-10-16 二次整改）：站内代码已全部外置（onclick/<style>/内联<script> 清零，
# 由 verify_deploy 断言把关），这里才能不上 'unsafe-inline'。
# 白名单 host 为 AdSense/广告系——当前 enableAds=false 不产生任何外链请求，纯粹为将来
# 开广告预留，避免届时改 nginx。若某天浏览器报 CSP 违规，按报告加 host，不要放开 'unsafe-inline'。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://www.google-analytics.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.googletagmanager.com https://www.google-analytics.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://fundingchoicesmessages.google.com; object-src 'none'; base-uri 'none'; form-action 'self'" always;
