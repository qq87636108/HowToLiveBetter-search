# life.daogong.cc 生产 nginx 站点配置（2026-10-16 版本化真相源）
# 落地方式：scp 到生产 /etc/nginx/sites-available/life-daogong → nginx -t → systemctl reload nginx
# 改动点（相对 2026-10-16 之前的旧配置）：
#   ① 补安全响应头（include snippets/gvl-headers.conf；nginx add_header 不继承，故每个自带
#      add_header 的 location 都要 include）——nosniff / Referrer-Policy / X-Frame-Options / Permissions-Policy
#   ② 缓存分档：HTML（含新增的 /detail/<id>.html 预渲染页）600s；JSON 数据 1800s；
#      JS/CSS/图片 86400s；sitemap/robots 3600s
#      ★旧配置 `\.js$ → no-cache` 已废：本站 JS 是渲染链正身，每次回源 65–310KB 无谓成本
#   ③ 预渲染详情页 /detail/ 与 / 同策略（静态 HTML，无渲染依赖）

server {
    listen 443 ssl;
    server_name www.life.daogong.cc;
    ssl_certificate /etc/letsencrypt/live/life.daogong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/life.daogong.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://life.daogong.cc$request_uri;
}

server {
    listen 80;
    server_name www.life.daogong.cc;
    return 301 https://life.daogong.cc$request_uri;
}

server {
    listen 80;
    server_name life.daogong.cc;
    return 301 https://life.daogong.cc$request_uri;
}

server {
    server_name life.daogong.cc;
    root /root/www/life.daogong.cc;
    index index.html;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / { try_files $uri $uri/ =404; include /etc/nginx/snippets/gvl-headers.conf; }

    # 预渲染详情页 / 首页 / 政策页：短缓存（内容随每日数据更新；每次发布都会清 CF 缓存）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        include /etc/nginx/snippets/gvl-headers.conf;
    }

    # 前端 fetch 的数据（search-index/synonyms/keywords/scenes/df/sec-*.json）
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=1800" always;
        include /etc/nginx/snippets/gvl-headers.conf;
    }

    # 渲染链正身与静态资源
    location ~* \.(js|css|svg|png|jpg|jpeg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/gvl-headers.conf;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        include /etc/nginx/snippets/gvl-headers.conf;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        include /etc/nginx/snippets/gvl-headers.conf;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/life.daogong.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/life.daogong.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
